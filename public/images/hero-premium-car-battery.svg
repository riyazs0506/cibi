<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Premium 12 volt car battery">
  <title>Premium 12 volt car battery</title>
  
  <defs>
    <linearGradient id="caseFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3d5a"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#5b9dff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="560" fill="none"/>
  <circle cx="360" cy="270" r="255" fill="url(#glow)"/>
  <!-- concentric rings imply energy without any literal effect -->
  <circle cx="360" cy="270" r="196" fill="none" stroke="#5b9dff" stroke-opacity="0.14"/>
  <circle cx="360" cy="270" r="248" fill="none" stroke="#5b9dff" stroke-opacity="0.08"/>
  <g transform="translate(40, 52)">
    
  <!-- ground shadow -->
  <ellipse cx="320" cy="410" rx="267.8" ry="16" fill="#102a43" opacity="0.08"/>

  <!-- side face -->
  <path d="M451 152 L561 89 L561 333 L451 396 Z" fill="#0a1e30"/>

  <!-- top face -->
  <path d="M79 152 L189 89 L561 89 L451 152 Z" fill="#27547a"/>

  <!-- lid inset -->
  <path d="M118.9 141.9 L193.7 99.1 L521.1 99.1 L446.3 141.9 Z" fill="#1c3d5a" opacity="0.75"/>
  <ellipse cx="242.9" cy="130.6" rx="16.7" ry="8.2" fill="#0a1e30" opacity="0.35"/><ellipse cx="302.4" cy="130.6" rx="16.7" ry="8.2" fill="#0a1e30" opacity="0.35"/><ellipse cx="361.9" cy="130.6" rx="16.7" ry="8.2" fill="#0a1e30" opacity="0.35"/>

  <!-- front face -->
  <rect x="79" y="152" width="372" height="244" rx="7" fill="url(#caseFront)"/>
  <!-- soft top highlight on the front face -->
  <rect x="79" y="152" width="372" height="78.1" rx="7" fill="#ffffff" opacity="0.05"/>

  <!-- label plate -->
  <rect x="119.9" y="225.2" width="290.2" height="102.5" rx="9" fill="#f8fafc" opacity="0.96"/>
  <rect x="119.9" y="225.2" width="290.2" height="4.5" rx="2.2" fill="#5b9dff"/>
  <text x="265" y="273.4" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#102a43" letter-spacing="-0.3">CIBI POWER</text>
  <text x="265" y="305.1" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#486581" letter-spacing="0.4">12 V / 45 Ah</text>

  <!-- terminals: accent marks positive, neutral marks negative -->
  
    <ellipse cx="208.2" cy="114.2" rx="22" ry="11" fill="#0a1e30" opacity="0.55"/>
    <rect x="190.2" y="91.2" width="36" height="23" fill="#5b9dff"/>
    <ellipse cx="208.2" cy="114.2" rx="18" ry="9" fill="#5b9dff"/>
    <ellipse cx="208.2" cy="91.2" rx="18" ry="9" fill="#8dbcff"/>
  
    <ellipse cx="453.8" cy="114.2" rx="22" ry="11" fill="#0a1e30" opacity="0.55"/>
    <rect x="435.8" y="91.2" width="36" height="23" fill="#829ab1"/>
    <ellipse cx="453.8" cy="114.2" rx="18" ry="9" fill="#829ab1"/>
    <ellipse cx="453.8" cy="91.2" rx="18" ry="9" fill="#a8bccd"/>
  </g>
</svg>
