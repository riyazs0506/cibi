<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Solar inverters">
  <title>Solar inverters</title>
  <defs>
    <linearGradient id="glassFace" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#2d5f8a"/>
      <stop offset="55%" stop-color="#1c3d5a"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="caseFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3d5a"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f1f8"/>
      <stop offset="100%" stop-color="#c3d3e2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#5b9dff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" fill="#f8fafc"/>
  <circle cx="320" cy="210" r="248" fill="url(#glow)"/>
  <ellipse cx="320" cy="358" rx="140" ry="15" fill="#102a43" opacity="0.08"/>
  <rect x="196" y="118" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="118" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/><rect x="196" y="130" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="130" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/><rect x="196" y="142" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="142" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/><rect x="196" y="154" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="154" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/><rect x="196" y="166" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="166" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/><rect x="196" y="178" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="178" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/><rect x="196" y="190" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
            <rect x="432" y="190" width="12" height="6" rx="3" fill="#0a1e30" opacity="0.55"/>
  <rect x="243" y="324" width="18" height="26" rx="6" fill="#829ab1"/><rect x="311" y="324" width="18" height="26" rx="6" fill="#829ab1"/><rect x="379" y="324" width="18" height="26" rx="6" fill="#829ab1"/>

  <!-- body -->
  <rect x="208" y="92" width="224" height="232" rx="18" fill="url(#caseFront)"/>
  <rect x="208" y="92" width="224" height="69.6" rx="18" fill="#ffffff" opacity="0.05"/>

  <!-- display -->
  <rect x="236" y="126" width="168" height="74" rx="10" fill="#f8fafc"/>
  <rect x="236" y="126" width="168" height="4" rx="2" fill="#5b9dff"/>
  <text x="320" y="160" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#102a43">CIBI</text>
  <text x="320" y="182" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#486581">INVERTERS</text>

  <!-- status lights: one live, two idle -->
  <circle cx="248" cy="226" r="6" fill="#65c9a5"/>
  <circle cx="268" cy="226" r="6" fill="#829ab1" opacity="0.5"/>
  <circle cx="288" cy="226" r="6" fill="#829ab1" opacity="0.5"/>

  <!-- a generation curve, drawn as data rather than decoration -->
  <path d="M238 288 q 32 -6 52 -30 t 50 -34 q 26 -2 62 22"
