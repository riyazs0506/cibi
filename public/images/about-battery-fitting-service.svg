<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="A battery being fitted to a vehicle in a clean service bay">
  <title>A battery being fitted to a vehicle in a clean service bay</title>
  
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3d5a"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <radialGradient id="softGlow">
      <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" rx="24" fill="#f8fafc"/>
  <circle cx="200" cy="160" r="200" fill="url(#softGlow)"/>

  <!-- back panel: a service bay wall -->
  <rect x="56" y="70" width="418" height="300" rx="20" fill="url(#panel)" stroke="#e6eef5"/>
  <line x1="56" y1="150" x2="474" y2="150" stroke="#e6eef5"/>
  <circle cx="92" cy="110" r="7" fill="#5b9dff" opacity="0.5"/>
  <circle cx="116" cy="110" r="7" fill="#65c9a5" opacity="0.5"/>

  <!-- a vehicle profile, drawn as a single calm line -->
  <path d="M120 300 q14-56 62-58 h84 q34 0 58 30 l26 28 h44 q26 0 26 24 v18 q0 12-14 12 h-268 q-18 0-18-20 z"
        fill="#ffffff" stroke="#486581" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M196 246 h64 q24 0 42 22 l14 16 h-120 z" fill="#eef5ff" stroke="#486581" stroke-width="2"/>
  <circle cx="200" cy="354" r="26" fill="#ffffff" stroke="#102a43" stroke-width="3"/>
  <circle cx="200" cy="354" r="10" fill="#e6eef5"/>
  <circle cx="368" cy="354" r="26" fill="#ffffff" stroke="#102a43" stroke-width="3"/>
  <circle cx="368" cy="354" r="10" fill="#e6eef5"/>

  <!-- the battery being fitted, lifted forward -->
  <g transform="translate(404,214)">
    <rect x="6" y="10" width="150" height="112" rx="12" fill="#102a43" opacity="0.12"/>
    <rect x="0" y="0" width="150" height="112" rx="12" fill="url(#deep)"/>
    <rect x="18" y="34" width="114" height="56" rx="8" fill="#f8fafc"/>
    <rect x="18" y="34" width="114" height="4" rx="2" fill="#5b9dff"/>
    <text x="75" y="62" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">CIBI</text>
    <text x="75" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" fill="#486581">12 V</text>
    <rect x="26" y="-11" width="26" height="13" rx="4" fill="#5b9dff"/>
    <rect x="100" y="-11" width="26" height="13" rx="4" fill="#829ab1"/>
  </g>

  <!-- a quiet trust mark -->
  <g transform="translate(96,300)">
    <circle cx="34" cy="34" r="34" fill="#ffffff" stroke="#e6eef5"/>
    <path d="M34 16 l16 6 v14 c0 9.4-6.6 16.6-16 19.6-9.4-3-16-10.2-16-19.6V22z" fill="none" stroke="#65c9a5" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="m27 34 5 5 10-11" fill="none" stroke="#65c9a5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
